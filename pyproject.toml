[project]
name = "football-core"
version = "0.1.0"
description = "Shared data loading, pitch coordinates and plotting for the football-*-models repos"
readme = "README.md"
license = "MIT"
authors = [
    { name = "R. Berk Karataş", email = "rberkk@protonmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandera[polars]>=0.34.1",
    "polars>=2.0.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.11.2"]  # football_core.viz

[project.scripts]
fc = "football_core.cli:main"
football-core = "football_core.cli:main"  # alias: zsh and bash have a builtin `fc`

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# football_docs: docs-build tooling for every football-* site, outside the model repos' cache hash
module-name = ["football_core", "football_docs"]

[dependency-groups]
dev = [
    "football-core[viz]",  # doctests and mypy over src see matplotlib
    "hypothesis>=6.100.0",
    "kloppy==3.19.1",
    "mplsoccer>=1.8.1",
    "mypy>=1.13.0",
    "pytest>=9.1.1",
    "ruff>=0.8.0",
]
docs = [
    "mkdocstrings[python]>=1.0.0",
    "nbconvert>=7.16.0",
    "zensical==0.0.72",  # alpha: pinned exactly, bump deliberately
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-q --doctest-modules"
