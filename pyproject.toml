[project]
name = "football-core"
version = "0.1.0"
description = "Shared data loading, pitch coordinates and plotting for the football-*-models repos"
readme = "README.md"
license = "MIT"
authors = [
    { name = "R.Berk Karatas", email = "rberkk@protonmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.8.0",
]
docs = [
    "mkdocs-material>=9.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
