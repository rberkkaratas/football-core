site_name: football-core
site_description: "Shared data loading, pitch coordinates and plotting for the football-*-models repos"
site_author: R.Berk Karatas
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0.16.11/dist/katex.min.js
  - https://unpkg.com/katex@0.16.11/dist/contrib/auto-render.min.js

extra_css:
  - https://unpkg.com/katex@0.16.11/dist/katex.min.css

nav:
  - Home: index.md
  - Conventions: conventions.md
  - Data policy: data-policy.md
  - Modules: modules.md
  - API reference:
      - pitch: api/pitch.md
      - goalmouth: api/goalmouth.md
      - schema: api/schema.md
      - io.snapshot: api/snapshot.md
      - io.statsbomb: api/statsbomb.md
      - io.whoscored: api/whoscored.md
      - viz: api/viz.md
      - cli: api/cli.md
  - Roadmap: roadmap.md
